; ─── N_Rawit_Box PlatformIO Config ───────────────────────
[env:esp32-s3-n16r8]
platform   = espressif32
board      = esp32-s3-devkitc-1
framework  = arduino

; Flash 16MB, PSRAM 8MB (OPI PSRAM)
board_build.flash_size      = 16MB
board_build.partitions      = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; Build flags
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

; Libraries
lib_deps =
    ESP Async WebServer        ; ถ้าต้องการเปลี่ยนเป็น async ภายหลัง

; Upload
monitor_speed = 115200
upload_speed  = 921600

; Partition table (16MB)
; default_16MB.csv แบ่ง:
;   nvs      3.5KB
;   ota_0    6MB
;   ota_1    6MB
;   spiffs   3MB (เก็บ config เสริม)
; ** SD Card เก็บ DataBox หลัก **
